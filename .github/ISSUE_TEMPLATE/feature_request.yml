name: Feature request
description: Suggest an AdvisorOps workflow or architecture improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What relationship-manager problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Data / AI / compliance considerations
      description: Note any impact on authority-owned facts, personal data, Priority rules, or external AI.
